name: CineVoice checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile render_movie.py generate_favicons.py
      - name: Run Python tests
        run: python -m unittest discover -s tests -v

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY' > /tmp/cinevoice-inline.js
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\s\S]*?)</script>", html)
          if not scripts:
              raise SystemExit("No inline script found")
          print(scripts[-1])
          PY
          node --check /tmp/cinevoice-inline.js
