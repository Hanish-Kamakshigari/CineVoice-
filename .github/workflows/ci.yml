name: CineVoice checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile render_movie.py generate_favicons.py video_colorist.py editor_colorist.py editor_server.py editor_render.py video_enhancer.py
      - name: Run Python tests
        run: python -m unittest discover -s tests -v

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check editor and serverless JavaScript syntax
        run: node --check editor.js && node --check api/coach.js && node --check api/colorist.js
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY' > /tmp/cinevoice-inline.js
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\s\S]*?)</script>", html)
          if not scripts:
              raise SystemExit("No inline script found")
          print(scripts[-1])
          PY
          node --check /tmp/cinevoice-inline.js
      - name: Check editor and reference-match scripts
        run: |
          node --check editor.js
          node --check reference_match.js
          node --check api/reference-match.js
      - name: Run frontend and API tests
        run: |
          node tests/test_reference_match.js
          node tests/test_reference_match_api.js
